<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Run and share mimium code in your browser with the mimium web editor.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="mimium web editor">
  <meta property="og:description" content="Run and share mimium code in your browser with the mimium web editor.">
  <meta property="og:image" content="./mimium-web-editor.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="mimium web editor">
  <meta name="twitter:description" content="Run and share mimium code in your browser with the mimium web editor.">
  <meta name="twitter:image" content="./mimium-web-editor.png">
  <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon-180x180.png">
  <title>mimium web editor</title>
  <style>
    /* NOTE: Do NOT use a global * { box-sizing/margin/padding } reset here.
       Monaco Editor injects CSS into <head> and measures character widths via
       hidden DOM spans; a universal reset corrupts those measurements and causes
       view-line tokens to render with wrong characters. Scope any resets to
       specific app elements only. */

    :root {
      --bg: #1E1E2E;
      --fg: #D4D4D4;
      --accent: #569CD6;
      --btn-bg: #2D2D3D;
      --btn-hover: #3D3D4D;
      --btn-active: #4D4D5D;
      --border: #404050;
      --success: #4EC9B0;
      --danger: #F44747;
      --warning: #CCA700;
      --sidebar-w: 200px;
      --editor-max-w: 960px;
      --header-h: 48px;
      --footer-h: 72px;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Apply box-sizing only to our own app elements, not Monaco's internals */
    .app, .app-header, .header-left, .logo-link,
    .app-body, .app-footer, .sidebar, .sidebar-header,
    .sidebar-list, .sidebar-item, .sidebar-msg, .sidebar-backdrop,
    .editor-area, #editorContainer,
    .controls, .btn, .btn-sidebar,
    .volume-control, .volume-label, .volume-value, #masterVolSlider,
    .meter-area, #meterCanvas, #scopeCanvas,
    .status-area, .status-dot,
    .error-panel, .error-panel-icon, .error-panel-msg, .error-panel-close {
      box-sizing: border-box;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    .app-header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 8px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .logo {
      width: 96px;
      height: 28px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .logo-link {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      text-decoration: none;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .logo-link:hover { opacity: 0.75; }

    .app-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      user-select: none;
      white-space: nowrap;
      word-break: keep-all;
      flex-shrink: 0;
    }

    /* ── Body: sidebar + editor side by side ── */
    .app-body {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative; /* anchor for mobile sidebar overlay */
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 0;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #18182a;
      border-right: 0 solid var(--border);
      transition: width 0.2s ease, border-right-width 0.2s ease;
      z-index: 5;
    }

    .sidebar--open {
      width: var(--sidebar-w);
      border-right-width: 1px;
    }

    .sidebar-header {
      padding: 8px 12px 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
      scrollbar-width: thin;
      scrollbar-color: #404050 transparent;
    }

    .sidebar-item {
      display: block;
      width: 100%;
      padding: 6px 12px;
      text-align: left;
      background: none;
      border: none;
      color: #aaa;
      font-size: 12px;
      font-family: "SF Mono", "Fira Mono", Menlo, Consolas, monospace;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.1s, color 0.1s;
    }
    .sidebar-item:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
    .sidebar-item--active { color: var(--accent); background: rgba(86,156,214,0.08); }
    .sidebar-item--loading { opacity: 0.55; cursor: wait; }

    .sidebar-msg {
      padding: 12px;
      font-size: 11px;
      color: #555;
      text-align: center;
      line-height: 1.5;
    }
    .sidebar-msg--error { color: var(--danger); }

    /* Mobile: sidebar slides over the editor as an overlay */
    .sidebar-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 4;
    }

    @media (max-width: 767px) {
      .sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 5;
        /* width: 0 when closed → slides in */
        box-shadow: none;
        transition: width 0.2s ease, box-shadow 0.2s ease;
      }
      .sidebar--open {
        width: var(--sidebar-w);
        box-shadow: 4px 0 24px rgba(0,0,0,0.55);
        border-right-width: 1px;
      }
      .sidebar-backdrop { display: block; }
      .sidebar-backdrop--visible { display: block; }
      /* hide backdrop when not visible */
      .sidebar-backdrop:not(.sidebar-backdrop--visible) { display: none; }
    }

    /* ── Editor area ── */
    .editor-area {
      flex: 1;
      display: flex;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      background: #13131e; /* slightly darker surround when editor is constrained */
    }

    #editorContainer {
      width: 100%;
      max-width: var(--editor-max-w);
      height: 100%;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Footer ── */
    .app-footer {
      height: var(--footer-h);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: rgba(0,0,0,0.25);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 6px;
    }

    .volume-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 190px;
      color: #aab3c4;
      font-size: 11px;
      user-select: none;
    }

    .volume-label {
      font-family: "SF Mono", "Fira Mono", Menlo, Consolas, monospace;
      opacity: 0.9;
      white-space: nowrap;
    }

    #masterVolSlider {
      width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .volume-value {
      width: 38px;
      text-align: right;
      font-family: "SF Mono", "Fira Mono", Menlo, Consolas, monospace;
      color: #8ea2bd;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--btn-bg);
      color: var(--fg);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      user-select: none;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--btn-hover); }
    .btn:active:not(:disabled) { background: var(--btn-active); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-sidebar {
      padding: 5px 8px;
      font-size: 15px;
      line-height: 1;
      color: #888;
      border-color: transparent;
      background: transparent;
    }
    .btn-sidebar:hover:not(:disabled) { color: var(--fg); background: rgba(255,255,255,0.06); }
    .btn-sidebar--active { color: var(--accent) !important; }

    .btn-play   { border-color: var(--success); color: var(--success); }
    .btn-play:hover:not(:disabled)   { background: rgba(78,201,176,0.15); }
    .btn-stop   { border-color: var(--danger);  color: var(--danger); }
    .btn-stop:hover:not(:disabled)   { background: rgba(244,71,71,0.15); }
    .btn-update { border-color: var(--warning); color: var(--warning); }
    .btn-update:hover:not(:disabled) { background: rgba(204,167,0,0.15); }
    .btn-share  { border-color: var(--accent);  color: var(--accent); }
    .btn-share:hover:not(:disabled)  { background: rgba(86,156,214,0.15); }
    .btn-share {
      max-width: min(52vw, 520px);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Meter ── */
    .meter-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #meterCanvas {
      display: block;
      border-radius: 3px;
      width: 240px;
      height: 40px;
    }

    #scopeCanvas {
      display: block;
      border-radius: 3px;
      width: 300px;
      height: 52px;
    }

    /* ── Status ── */
    .status-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
      margin-left: auto;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }

    .status-dot--playing {
      background: var(--success);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Error panel ── */
    .error-panel {
      display: none;
      align-items: flex-start;
      gap: 8px;
      padding: 7px 12px;
      background: rgba(244,71,71,0.10);
      border-top: 1px solid rgba(244,71,71,0.35);
      color: var(--danger);
      font-size: 11px;
      font-family: "SF Mono", "Fira Mono", Menlo, Consolas, monospace;
      max-height: 96px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .error-panel--visible { display: flex; }
    .error-panel-icon { flex-shrink: 0; margin-top: 1px; }
    .error-panel-msg  { flex: 1; margin: 0; white-space: pre-wrap; word-break: break-all; }
    .error-panel-close {
      flex-shrink: 0;
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      line-height: 1;
      opacity: 0.7;
    }
    .error-panel-close:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <button class="btn btn-sidebar" id="sidebarToggle" title="Toggle examples">&#9776;</button>
        <a href="https://mimium.org" target="_blank" rel="noopener" class="logo-link">
          <img src="/mimium_logo_slant.svg" alt="mimium" class="logo">
          <span class="app-title">mimium web editor</span>
        </a>
      </div>
      <div>
        <button class="btn btn-share" id="shareBtn" title="Share URL">&#128279; Share URL</button>
      </div>
    </header>

    <div class="app-body">
      <!-- Backdrop for mobile sidebar overlay -->
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Examples</div>
        <div class="sidebar-list" id="sidebarList"></div>
      </aside>

      <div class="editor-area">
        <div id="editorContainer"></div>
      </div>
    </div>

    <div class="error-panel" id="errorPanel">
      <span class="error-panel-icon">&#9888;</span>
      <pre class="error-panel-msg" id="errorMsg"></pre>
      <button class="error-panel-close" id="errorClose" title="Dismiss">&#10005;</button>
    </div>

    <footer class="app-footer">
      <div class="controls">
        <button class="btn btn-play"   id="playBtn">&#9654; Play</button>
        <button class="btn btn-stop"   id="stopBtn">&#9632; Stop</button>
        <button class="btn btn-update" id="updateBtn" disabled>&#8635; Update</button>
      </div>
      <div class="volume-control">
        <span class="volume-label">Main Vol.</span>
        <input id="masterVolSlider" type="range" min="-70" max="10" step="0.1" value="5.1" aria-label="Master Volume (dB)">
        <span class="volume-value" id="masterVolValue">+5.1dB</span>
      </div>
      <div class="meter-area">
        <canvas id="meterCanvas"></canvas>
        <canvas id="scopeCanvas"></canvas>
      </div>
      <div class="status-area">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
